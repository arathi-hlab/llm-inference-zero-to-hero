<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-label="KV cache memory versus tokens kept, GQA versus MHA, with SGLang measurement"><title>KV cache memory versus tokens kept, GQA versus MHA, with SGLang measurement</title><rect width="760" height="420" rx="12" fill="#fcfcfb"/><text x="24.0" y="34.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="650" fill="#0b0b0b" text-anchor="start">KV cache memory for ONE sequence · Llama 3.1 8B, bf16</text><text x="24.0" y="56.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Grows linearly with every token kept — grouped-query attention cuts it 4×</text><line x1="70" x2="540" y1="350.0" y2="350.0" stroke="#c3c2b7" stroke-width="1"/><text x="60.0" y="354.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#898781" text-anchor="end">0 GiB</text><line x1="70" x2="540" y1="280.0" y2="280.0" stroke="#e1e0d9" stroke-width="1"/><text x="60.0" y="284.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#898781" text-anchor="end">4 GiB</text><line x1="70" x2="540" y1="210.0" y2="210.0" stroke="#e1e0d9" stroke-width="1"/><text x="60.0" y="214.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#898781" text-anchor="end">8 GiB</text><line x1="70" x2="540" y1="140.0" y2="140.0" stroke="#e1e0d9" stroke-width="1"/><text x="60.0" y="144.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#898781" text-anchor="end">12 GiB</text><line x1="70" x2="540" y1="70.0" y2="70.0" stroke="#e1e0d9" stroke-width="1"/><text x="60.0" y="74.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#898781" text-anchor="end">16 GiB</text><text x="70.0" y="370.0"