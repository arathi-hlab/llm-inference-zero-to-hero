<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-label="Diagram of one decode step using a KV cache"><title>Diagram of one decode step using a KV cache</title><rect width="760" height="330" rx="12" fill="#fcfcfb"/><text x="24.0" y="34.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="650" fill="#0b0b0b" text-anchor="start">One decode step with a KV cache</text><text x="24.0" y="56.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Only the newest token makes a Query. Past Keys &amp; Values are read back, not recomputed.</text><text x="196.0" y="82.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="middle">“The”</text><text x="296.0" y="82.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="middle">“cat”</text><text x="396.0" y="82.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="middle">“sat”</text><text x="496.0" y="82.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="middle">“on”</text><text x="136.0" y="122.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="end">Keys</text><rect x="150" y="92" width="92" height="46" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="2"/><text x="196.0" y="120.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="middle">k1</text><rect x="250" y="92" width="92" height="46" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="2"/><text x="296.0" y="120.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="middle">k2</text><rect x="350" y="92" width="92" height="46" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="2"/><text x="396.0" y="120.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="middle">k3</text><rect x="450" y="92" width="92" height="46" rx="8" fill="#2a78d6" stroke="#2a78d6" stroke-width="2"/><text x="496.0" y="120.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="650" fill="#fcfcfb" text-anchor="middle">k4</text><text x="136.0" y="180.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="end">Values</text><rect x="150" y="150" width="92" height="46" rx="8" fill="#fbe0d4" stroke="#eb6834" stroke-width="2"/><text x="196.0" y="178.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="middle">v1</text><rect x="250" y="150" width="92" height="46" rx="8" fill="#fbe0d4" stroke="#eb6834" stroke-width="2"/><text x="296.0" y="178.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="middle">v2</text><rect x="350" y="150" width="92" height="46" rx="8" fill="#fbe0d4" stroke="#eb6834" stroke-width="2"/><text x="396.0" y="178.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="middle">v3</text><rect x="450" y="150" width="92" height="46" rx="8" fill="#eb6834" stroke="#eb6834" stroke-width="2"/><text x="496.0" y="178.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="650" fill="#fcfcfb" text-anchor="middle">v4</text><path d="M150,212 v8 h292 v-8" fill="none" stroke="#898781" stroke-width="1.5"/><text x="296.0" y="240.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle">cached from earlier steps, reused</text><text x="496.0" y="240.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle">new, appended</text><rect x="450" y="262" width="92" height="46" rx="8" fill="#1baf7a" stroke="#1baf7a" stroke-width="2"/><text x="496.0" y="291.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#fcfcfb" text-anchor="middle">q4</text><text x="436.0" y="282.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="end">the only Query computed:</text><text x="436.0" y="300.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="end">q4 scores k1…k4, then mixes v1…v4</text><rect x="556" y="92" width="96" height="104" rx="10" fill="#e3e0f8" stroke="#6250d6" stroke-width="2"/><text x="604.0" y="132.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="middle">one copy</text><text x="604.0" y="150.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="middle">per layer</text><text x="604.0" y="172.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">×32 in Llama 3</text></svg>